services:
  app:
    build:
      context: ..
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # Each hosted worker uses about ten threads and signal-cli about twenty; 30 collectors need headroom.
    pids_limit: 1024
    # Keep a runaway process from taking the host down; the kernel kills inside the cgroup first.
    mem_limit: 3g
    memswap_limit: 3g
    env_file: .env
    volumes:
      - archive-data:/data
      # signal-cli expands a large native library here. Disk storage avoids
      # spending the server's RAM on executable library copies; no sessions
      # are stored in this cache. The supervisor clears each worker's files.
      - signal-native-cache:/run/signal-native
      - /opt/afterword/downloads:/app/downloads:ro
    ports:
      - '127.0.0.1:4318:4318'
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777,noexec,nosuid,nodev
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
volumes:
  archive-data:
  signal-native-cache:
